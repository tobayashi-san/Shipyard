name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Run backend tests
        working-directory: server
        run: npm test

      - name: Check typed backend feature boundaries
        working-directory: server
        run: npm run typecheck

      - name: Audit root development dependencies
        run: npm audit

      - name: Audit backend dependencies, including test tools
        working-directory: server
        run: npm audit

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Build frontend
        working-directory: frontend-next
        run: npm run build

      - name: Check frontend types
        working-directory: frontend-next
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend-next
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend-next
        run: npm test

      - name: Install backend dependencies for browser tests
        working-directory: server
        run: npm ci

      - name: Run browser end-to-end tests
        working-directory: frontend-next
        run: |
          npx playwright install --with-deps firefox
          npm run test:e2e

      - name: Audit frontend dependencies, including build tools
        working-directory: frontend-next
        run: npm audit

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: shipyard:ci

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs shipyard-smoke || true; docker rm -f shipyard-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name shipyard-smoke \
            -e JWT_SECRET=ci-smoke-jwt-secret-0000000000000000 \
            -e SHIPYARD_KEY_SECRET=ci-smoke-key-secret-00000000000000 \
            -p 127.0.0.1:8443:8443 shipyard:ci
          for attempt in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:8443/api/health >/dev/null; then break; fi
            if [[ "$attempt" == 30 ]]; then exit 1; fi
            sleep 1
          done
          docker restart shipyard-smoke >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent --insecure https://127.0.0.1:8443/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Check container configuration and recovery
        run: node tools/test-container.mjs shipyard:ci
