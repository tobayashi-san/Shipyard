services:
  fleet:
    # Pin a released version in production. `latest` remains convenient for
    # small private installations and is the default when FLEET_IMAGE is unset.
    image: ${FLEET_IMAGE:-ghcr.io/tobayashi-san/fleet:latest}
    container_name: fleet
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      # Safe default: reachable only from this Docker host or a local reverse
      # proxy. Set FLEET_BIND_ADDRESS to a private-LAN address deliberately.
      - "${FLEET_BIND_ADDRESS:-127.0.0.1}:${FLEET_PORT:-443}:8443"
    volumes:
      - fleet-data:/app/server/data
      # Secrets generated on first start. Kept apart from the data volume so
      # application backups never include the key that decrypts them.
      - fleet-secrets:/app/secrets
      - fleet-workspaces:/workspaces
      - ./playbooks:/app/server/playbooks
      # To use a host directory for OpenTofu instead, replace the
      # fleet-workspaces mount above with:
      # - /path/to/workspaces:/workspaces
      # Custom TLS certificate (optional):
      # - /etc/ssl/certs/fleet.crt:/certs/fleet.crt:ro
      # - /etc/ssl/private/fleet.key:/certs/fleet.key:ro
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Europe/Zurich}
      - FLEET_TIMEZONE=${FLEET_TIMEZONE:-Europe/Zurich}
      - FLEET_MAX_FILE_TRANSFER_BYTES=${FLEET_MAX_FILE_TRANSFER_BYTES:-1073741824}
      # Optional: generated automatically on first start when left empty.
      - JWT_SECRET=${JWT_SECRET:-}
      - FLEET_KEY_SECRET=${FLEET_KEY_SECRET:-}
      - CERT_SANS=${CERT_SANS:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - FLEET_MFA_POLICY=${FLEET_MFA_POLICY:-optional}
      - FLEET_TERMINAL_IDLE_MINUTES=${FLEET_TERMINAL_IDLE_MINUTES:-30}
      # Set to 0 to stop checking GitHub for newer stable releases.
      - FLEET_UPDATE_CHECK=${FLEET_UPDATE_CHECK:-1}
      - FLEET_TERMINAL_MAX_MINUTES=${FLEET_TERMINAL_MAX_MINUTES:-480}
      # Days before the full log of finished runs is cut down to its last 16 KB.
      - FLEET_HISTORY_OUTPUT_DAYS=${FLEET_HISTORY_OUTPUT_DAYS:-90}
      - FLEET_PLUGIN_TRUST_POLICY=${FLEET_PLUGIN_TRUST_POLICY:-warn}
      - FLEET_TRUSTED_PLUGIN_SHA256=${FLEET_TRUSTED_PLUGIN_SHA256:-}
      - FLEET_RENEW_CERT=${FLEET_RENEW_CERT:-0}
      # - SSL_CERT=/certs/fleet.crt
      # - SSL_KEY=/certs/fleet.key
      # Configure CERT_SANS, ALLOWED_ORIGINS and TRUST_PROXY in .env when needed.
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({hostname:'localhost',port:8443,path:'/api/health',rejectUnauthorized:false}, r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  fleet-data:
  fleet-secrets:
  fleet-workspaces:
