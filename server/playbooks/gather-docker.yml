---
- name: Gather Containers
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: Detect container runtime (docker or podman)
      shell: "command -v docker 2>/dev/null || command -v podman 2>/dev/null"
      register: runtime_bin
      changed_when: false
      failed_when: false

    - name: Get rootful containers
      shell: |
        RUNTIME="{{ runtime_bin.stdout }}"
        resolve_image() {
          local name="$1"
          local img
          img=$($RUNTIME inspect "$name" --format '{% raw %}{{.Config.Image}}{% endraw %}' 2>/dev/null || echo "")
          # If Config.Image is a bare hash (12 hex chars or sha256:...), resolve via image tags
          if echo "$img" | grep -qP '^[a-f0-9]{12}$|^sha256:[a-f0-9]+$'; then
            local tagged
            tagged=$($RUNTIME image inspect "$img" --format '{% raw %}{{range .RepoTags}}{{println .}}{{end}}{% endraw %}' 2>/dev/null | head -1)
            [ -n "$tagged" ] && img="$tagged"
          fi
          echo "${img:-unknown}"
        }
        $RUNTIME ps -a --format '{% raw %}{{.Names}}|{{.State}}|{{.Status}}|{{.CreatedAt}}|{{.Label "com.docker.compose.project"}}|{{.Label "com.docker.compose.project.working_dir"}}{% endraw %}' | while IFS='|' read -r name state status created proj dir; do
          img=$(resolve_image "$name")
          printf '%s|%s|%s|%s|%s|%s|%s\n' "$name" "$img" "$state" "$status" "$created" "$proj" "$dir"
        done
      args:
        executable: /bin/bash
      register: rootful_ps
      when: runtime_bin.rc == 0 and runtime_bin.stdout != ''
      changed_when: false
      failed_when: false

    # Rootless Docker and Podman use per-user sockets below /run/user/<uid>.
    - name: Find rootless container runtime sockets
      shell: |
        find /run/user -maxdepth 3 -type s \( -path '*/docker.sock' -o -path '*/podman.sock' \) 2>/dev/null \
          | sed -nE 's|^/run/user/([0-9]+)/(docker|podman)/.*$|\1|\2|p; s|^/run/user/([0-9]+)/(docker|podman)\.sock$|\1|\2|p' \
          | sort -u
      register: rootless_runtimes
      changed_when: false
      failed_when: false

    - name: Get rootless containers per user
      shell: |
        UID_VAL="{{ item.split('|')[0] }}"
        RUNTIME="{{ item.split('|')[1] }}"
        USERNAME=$(getent passwd "$UID_VAL" | cut -d: -f1)
        XDG_RUNTIME_DIR=/run/user/$UID_VAL runuser -u "$USERNAME" -- \
          bash -c 'resolve_image() {
            local name="$1" img tagged
            img=$('"$RUNTIME"' inspect "$name" --format "{% raw %}{{.Config.Image}}{% endraw %}" 2>/dev/null || echo "")
            if echo "$img" | grep -qP "^[a-f0-9]{12}$|^sha256:[a-f0-9]+$"; then
              tagged=$('"$RUNTIME"' image inspect "$img" --format "{% raw %}{{range .RepoTags}}{{println .}}{{end}}{% endraw %}" 2>/dev/null | head -1)
              [ -n "$tagged" ] && img="$tagged"
            fi
            echo "${img:-unknown}"
          }
          '"$RUNTIME"' ps -a --format "{% raw %}{{.Names}}|{{.State}}|{{.Status}}|{{.CreatedAt}}|{{.Label \"com.docker.compose.project\"}}|{{.Label \"com.docker.compose.project.working_dir\"}}{% endraw %}" | while IFS="|" read -r name state status created proj dir; do
            img=$(resolve_image "$name")
            printf "%s|%s|%s|%s|%s|%s|%s\n" "$name" "$img" "$state" "$status" "$created" "$proj" "$dir"
          done'
      args:
        executable: /bin/bash
      loop: "{{ rootless_runtimes.stdout_lines | default([]) }}"
      register: rootless_ps
      changed_when: false
      failed_when: false

    - name: Display container info
      debug:
        msg: "{{ (rootful_ps.stdout_lines | default([])) + (rootless_ps.results | default([]) | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten) }}"
